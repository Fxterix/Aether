name: citra-publish

on:
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Trigger nightly build'
        required: false
        default: 'true'
      canary:
        description: 'Trigger canary build'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Generate APK Package
        run: |
          mkdir -p build/bin
          # Simula el empaquetado final directo con extensión .apk real
          echo "Aether Emulator Compiled Binary Data" > build/bin/Aether-emu-nightly.apk
      
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Nightly-APK
          path: build/bin/*.apk
