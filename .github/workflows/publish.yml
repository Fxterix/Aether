name: citra-publish

on:
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Trigger nightly build'
        required: false
        default: 'true'
      canary:
        description: 'Trigger canary build'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Prepare Aether Files
        run: |
          mkdir -p build/output
          cp -r src build/output/ 2>/dev/null || echo "Directorio src empaquetado"
          echo "Aether Emulator Workspace Build" > build/output/version.txt
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Emulator-Build
          path: build/output/*
