name: citra-publish

on:
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Trigger nightly build'
        required: false
        default: 'true'
      canary:
        description: 'Trigger canary build'
        required: false
        default: 'true'

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Android SDK & Build
        run: |
          echo "Simulando compilación directa sin scripts externos de GitHub..."
          mkdir -p build/artifacts
          echo "Aether APK Placeholder" > build/artifacts/Aether-emu.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aether-Nightly-APK
          path: build/artifacts/*.apk

  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Android SDK & Build
        run: |
          echo "Simulando compilación directa sin scripts externos de GitHub..."
          mkdir -p build/artifacts
          echo "Aether APK Placeholder" > build/artifacts/Aether-emu.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aether-Canary-APK
          path: build/artifacts/*.apk
