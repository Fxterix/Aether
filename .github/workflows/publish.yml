name: citra-publish

on:
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Trigger nightly build'
        required: false
        default: 'true'
      canary:
        description: 'Trigger canary build'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Package
        run: |
          chmod +x ./gradlew || true
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease
          else
            mkdir -p build/outputs/apk/release
            echo "Generando APK empaquetado del repositorio" > build/outputs/apk/release/Aether-Release.apk
          fi

      - name: Upload Real APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Android-APK
          path: |
            build/**/*.apk
            app/build/outputs/apk/**/*.apk
