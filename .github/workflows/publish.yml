name: citra-publish

on:
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Trigger nightly build'
        required: false
        default: 'true'
      canary:
        description: 'Trigger canary build'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile Project
        run: |
          mkdir -p build && cd build
          cmake .. -DANDROID_ABI=arm64-v8a -DANDROID_NATIVE_API_LEVEL=28 -DCMAKE_TOOLCHAIN_FILE=$ANDROID_SDK_ROOT/ndk/current/build/cmake/android.toolchain.cmake
          make -j$(nproc)

      - name: Upload Real APK
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Real-APK
          path: |
            build/**/*.apk
            build/*.apk
