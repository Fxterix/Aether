name: citra-publish

on:
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Trigger nightly build'
        required: false
        default: 'true'
      canary:
        description: 'Trigger canary build'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Build Aether
        run: |
          mkdir build && cd build
          cmake .. -DENABLE_QT=OFF -DENABLE_SDL2=OFF -DANDROID=ON
          make -j$(nproc)
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Emulator-APK
          path: build/bin/*.apk
