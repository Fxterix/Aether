name: citra-publish

on:
  workflow_dispatch:

jobs:
  build:
  # Omit optional warnings and set environment variables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Initialize Gradle Wrapper and Build APK
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Real APK
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Actual-APK
          path: |
            build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk
            **/*.apk
